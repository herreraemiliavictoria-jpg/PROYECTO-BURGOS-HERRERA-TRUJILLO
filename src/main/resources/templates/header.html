<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
   <head>
      <meta charset="UTF-8" />
   </head>
   <body>
      <!-- Fragmento del Header -->
      <div th:fragment="header">
         <nav class="navbar navbar-expand-lg navbar-dark navbar-gym shadow-sm py-3">
            <div class="container">
               <!-- Logo o Título que también redirige al inicio -->
               <a class="navbar-brand fw-bold" th:href="@{/}">
                  🏋️‍♂️ PowerGym Manager
               </a>

               <!-- Botón Hamburguesa (se muestra en pantallas chicas o celulares) -->
               <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
               </button>

               <!-- Elementos del menú desplegables con el botón hamburguesa -->
               <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                  <ul class="navbar-nav align-items-center gap-2">
                     <li class="nav-item">
                        <a class="nav-link active" th:href="@{/}">🏠 Inicio</a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link" th:href="@{/mostrarSocios}">👥 Lista de Socios</a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link" th:href="@{/nuevoSocio}">➕ Registrar Socio</a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link" th:href="@{/formularioBusquedaPorApellido}">🔍 Buscar Socio</a>
                     </li>
                  </ul>
               </div>
            </div>
         </nav>
      </div>
   </body>
</html>
