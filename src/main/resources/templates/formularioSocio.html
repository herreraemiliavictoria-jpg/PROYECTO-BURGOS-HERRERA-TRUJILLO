<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
   <head>
      <title>Registrar un socio</title>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- Carga de Bootstrap -->
      <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" type="text/css" />       
      <!-- Carga de tus estilos personalizados del gimnasio -->
      <link rel="stylesheet" th:href="@{/css/style.css}" type="text/css" />
   </head>
   <body>
      <div th:insert="header :: header"></div>

      <div class="container mt-4">
         <p class="lead">Formulario de socio</p>
         
         <!-- Formulario vinculado al objeto socio y mapeado al controlador -->
         <form th:action="@{/registrarSocio}" th:object="${socio}" method="POST">
            
            <div class="form-group row mb-3">
               <label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
               <div class="col-sm-10">
                  <input type="text" class="form-control" id="nombre" placeholder="Ingrese el nombre" th:field="*{nombre}" required />
               </div>
            </div>
            
            <div class="form-group row mb-3">
               <label for="apellido" class="col-sm-2 col-form-label">Apellido</label>
               <div class="col-sm-10">
                  <input type="text" class="form-control" id="apellido" placeholder="Ingrese el apellido" th:field="*{apellido}" required />
               </div>
            </div>

            <div class="form-group row mb-3">
               <label for="dni" class="col-sm-2 col-form-label">DNI</label>
               <div class="col-sm-10">
                  <input type="text" class="form-control" id="dni" placeholder="Ingrese el DNI" th:field="*{dni}" required />
               </div>
            </div>
              
            <!-- Selector de Membresía con todos los detalles -->
            <div class="form-group row mb-3">
               <label for="membresia" class="col-sm-2 col-form-label">Membresía</label>
               <div class="col-sm-10">
                  <select class="form-control" th:field="*{membresia.id}" required>
                     <option value="" disabled selected>-- Seleccione una membresía --</option>
                     <option th:each="m : ${membresias}" 
                             th:value="${m.id}" 
                             th:text="${m.tipo + ' (' + m.descripcion + ') - $' + m.costo + ' (' + m.duracionDias + ' días, ' + m.cantidadActPer + ' act/sem)'}">
                     </option>
                  </select>
               </div>
            </div>
            
            <div class="form-group row">
               <div class="col-sm-10 offset-sm-2">
                  <button type="submit" class="btn btn-primary">Guardar Socio</button>
                  <a th:href="@{/mostrarSocios}" class="btn btn-secondary">Ver Lista</a>
               </div>
            </div>
            
         </form>
         
         <span th:if="${mensaje != null}" class="text-success mt-3" th:text="${mensaje}"></span>
      </div>

      <div th:insert="footer :: footer"></div>
      
      <!-- Script CDN de Bootstrap para que funcione el menú hamburguesa -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   </body>
</html>
