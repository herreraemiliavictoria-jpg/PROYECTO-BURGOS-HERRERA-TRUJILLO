<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
   <head>
      <title>Búsqueda de socio por apellido</title>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- Carga de Bootstrap -->
      <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" type="text/css" />       
      <!-- Carga de tus estilos personalizados del gimnasio -->
      <link rel="stylesheet" th:href="@{/css/style.css}" type="text/css" />
   </head>
   <body>
      <div th:insert="header :: header"></div>
      
      <div class="container mt-4">
         <p class="lead">Búsqueda de socio por apellido</p>
         
         <form th:action="@{/buscarSociosPorApellido}" method="POST">
            
            <div class="form-group row mb-3">
               <label for="apellido" class="col-sm-2 col-form-label">Apellido</label>
               <div class="col-sm-10">
                  <input type="text" class="form-control" id="apellido" placeholder="Ingrese el apellido" name="apellido" required />
               </div>
            </div>
            
            <div class="form-group row">
               <div class="col-sm-10 offset-sm-2">
                  <button type="submit" class="btn btn-primary">Buscar</button>
                  <a th:href="@{/mostrarSocios}" class="btn btn-secondary">Volver a la lista</a>
               </div>
            </div>
            
         </form>
         
         <span th:if="${mensaje != null}" class="text-success mt-3" th:text="${mensaje}"></span>
      </div>

      <div th:insert="footer :: footer"></div>
      
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   </body>
</html>
