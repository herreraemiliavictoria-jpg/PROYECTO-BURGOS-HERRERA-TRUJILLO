<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
   <head>
      <title>Gestión de Gimnasio - Inicio</title>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- Carga de Bootstrap -->
      <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" type="text/css" />
      <!-- Carga de tu archivo de estilos personalizados -->
      <link rel="stylesheet" th:href="@{/css/style.css}" type="text/css" />
   </head>
   <body>
      
      <!-- Incluimos el header con el botón hamburguesa -->
      <div th:insert="header :: header"></div>

      <!-- Contenedor principal que centra la tarjeta con diseño moderno -->
      <div class="main-container container my-5">
         <div class="hero-card text-center mx-auto">
            <h1 class="hero-title mb-3">🏋️‍♂️ PowerGym Manager</h1>
            <p class="hero-subtitle">Sistema integral de control de socios y membresías para la gestión del gimnasio.</p>
            
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center mt-4">
               <a th:href="@{/mostrarSocios}" class="btn btn-gym-primary btn-lg px-4 m-1">Ver Lista de Socios</a>
               <a th:href="@{/nuevoSocio}" class="btn btn-gym-success btn-lg px-4 m-1">Registrar Nuevo Socio</a>
               <a th:href="@{/formularioBusquedaPorApellido}" class="btn btn-gym-secondary btn-lg px-4 m-1">Buscar por Apellido</a>
            </div>
         </div>
      </div>

     
      <div th:insert="footer :: footer"></div>

   
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   </body>
</html>
