<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
   <head>
      <title>Lista de socios</title>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" type="text/css" />       
      <link rel="stylesheet" th:href="@{/css/style.css}" type="text/css" />
   </head>
   <body>
      <div th:insert="header :: header"></div>
      
      <div class="container mt-4">
         <div class="d-flex justify-content-between align-items-center mb-3">
            <p class="lead m-0 fw-bold">Listado de socios registrados</p>
            <a th:href="@{/nuevoSocio}" class="btn btn-gym-primary btn-sm">➕ Nuevo Socio</a>
         </div>

         <!-- Barra de Filtros -->
         <form th:action="@{/mostrarSocios}" method="get" class="card card-gym p-3 mb-4">
            <div class="row g-2 align-items-end">
               <div class="col-md-5">
                  <label class="form-label small fw-bold">Buscar por Apellido</label>
                  <input type="text" name="apellido" th:value="${apellidoFiltro}" class="form-control" placeholder="Ej: Pérez..." />
               </div>
               <div class="col-md-4">
                  <label class="form-label small fw-bold">Filtrar por Plan / Membresía</label>
                  <select name="membresiaId" class="form-select">
                     <option value="">-- Todos los planes --</option>
                     <option th:each="m : ${membresias}" 
                             th:value="${m.id}" 
                             th:text="${m.tipo}"
                             th:selected="${m.id == membresiaFiltro}">
                     </option>
                  </select>
               </div>
               <div class="col-md-3 d-flex gap-2">
                  <button type="submit" class="btn btn-gym-primary w-100">🔍 Filtrar</button>
                  <a th:href="@{/mostrarSocios}" class="btn btn-gym-secondary">Limpiar</a>
               </div>
            </div>
         </form>

         <!-- Tabla de Socios -->
         <div class="table-responsive">
            <table class="table table-striped table-bordered table-gym shadow-sm">
               <thead>
                  <tr>
                     <th scope="col">ID</th>
                     <th scope="col">Nombre</th>
                     <th scope="col">Apellido</th>
                     <th scope="col">DNI</th>
                     <th scope="col">Membresía / Plan</th>
                  </tr>
               </thead>
               <tbody>
                  <tr th:each="socio : ${socios}">
                     <td th:text="${socio.id}"></td>
                     <td th:text="${socio.nombre}"></td>
                     <td th:text="${socio.apellido}"></td>
                     <td th:text="${socio.dni}"></td>
                     <td th:text="${socio.membresia != null ? socio.membresia.tipo + ' - $' + socio.membresia.costo + ' (' + socio.membresia.duracionDias + ' días)' : 'Sin Membresía'}"></td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(socios)}">
                     <td colspan="5" class="text-center py-4 text-muted">No se encontraron socios con los criterios seleccionados.</td>
                  </tr>
               </tbody>
            </table>
         </div>

         <!-- Controles de Paginación (Segmentación de a 5 registros) -->
         <nav th:if="${paginado and totalPaginas > 1}" aria-label="Navegación de páginas" class="mt-3">
            <ul class="pagination justify-content-center">
               <li class="page-item" th:classappend="${paginaActual == 0} ? 'disabled'">
                  <a class="page-link" th:href="@{/mostrarSocios(page=${paginaActual - 1})}">Anterior</a>
               </li>
               
               <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                   th:classappend="${i == paginaActual} ? 'active'">
                  <a class="page-link" th:href="@{/mostrarSocios(page=${i})}" th:text="${i + 1}"></a>
               </li>
               
               <li class="page-item" th:classappend="${paginaActual + 1 >= totalPaginas} ? 'disabled'">
                  <a class="page-link" th:href="@{/mostrarSocios(page=${paginaActual + 1})}">Siguiente</a>
               </li>
            </ul>
         </nav>
      </div>

      <div th:insert="footer :: footer"></div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   </body>
</html>
